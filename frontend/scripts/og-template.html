<!doctype html>
<!-- Social preview card template. Open in a browser at 1200x630 with ?c=home | wildflower-honey | eucalyptus-honey | forest-honey | honey-sampler and screenshot to public/og/. Replace with photography-based cards once real product photos exist. -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: F; src: url(../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-soft-normal.woff2) format('woff2'); font-weight: 100 900; }
@font-face { font-family: A; src: url(../node_modules/@fontsource-variable/anek-latin/files/anek-latin-latin-wght-normal.woff2) format('woff2'); font-weight: 100 900; }
html,body{margin:0}
body{width:1200px;height:630px;display:grid;grid-template-columns:1.1fr 1fr;background:#fbf7ee;color:#2b1b0c;font-family:A}
.text{padding:72px 64px;display:flex;flex-direction:column;justify-content:space-between}
.mark{font-family:F;font-variation-settings:'SOFT' 100;font-weight:600;font-size:44px;letter-spacing:-.02em}
h1{font-family:F;font-variation-settings:'SOFT' 100;font-weight:500;font-size:68px;line-height:1.04;letter-spacing:-.015em;margin:0}
.sub{font-size:26px;color:#6b5338;margin-top:20px}
.panel{background:radial-gradient(55% 45% at 50% 52%,rgba(251,183,21,.18),transparent 72%),#22150a;display:flex;align-items:center;justify-content:center;gap:34px;padding:40px}
.panel svg{height:400px;width:auto;filter:drop-shadow(0 0 28px rgba(251,183,21,.2))}
</style></head><body>
<div class="text"><div class="mark">ohoney</div><div><h1 id="h"></h1><div class="sub" id="s"></div></div></div>
<div class="panel" id="p"></div>
<script>
const honeys = {
  wildflower: { light:'#FADB8E', base:'#F0B444', deep:'#C98A1F' },
  eucalyptus: { light:'#F2B65A', base:'#D07F22', deep:'#94500E' },
  forest: { light:'#B86D22', base:'#743A12', deep:'#3D1C07' },
}
const cards = {
  home: { h:'Raw honey from three corners of South India', s:'Delivered across India. Pay on delivery.', v:['wildflower','eucalyptus','forest'] },
  'wildflower-honey': { h:'Wildflower Honey', s:'Light and floral. Nilgiri Hills, Tamil Nadu.', v:['wildflower'] },
  'eucalyptus-honey': { h:'Eucalyptus Honey', s:'Herbal and rounded. Mysore, Karnataka.', v:['eucalyptus'] },
  'forest-honey': { h:'Forest Honey', s:'Dark and bold. Western Ghats, Kerala.', v:['forest'] },
  'honey-sampler': { h:'Honey Sampler', s:'Wildflower, Eucalyptus and Forest in one gift box.', v:['wildflower','eucalyptus','forest'] },
}
const vessel = (c, i, fill) => { const top = 8 + (1-fill)*284; return `<svg viewBox="0 0 100 300"><defs>
<linearGradient id="g${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c.light}"/><stop offset=".45" stop-color="${c.base}"/><stop offset="1" stop-color="${c.deep}"/></linearGradient>
<radialGradient id="l${i}" cx=".42" cy=".4" r=".55"><stop offset="0" stop-color="${c.light}" stop-opacity=".7"/><stop offset="1" stop-color="${c.light}" stop-opacity="0"/></radialGradient>
<clipPath id="c${i}"><path d="M10 8 V252 A40 40 0 0 0 90 252 V8 Z"/></clipPath></defs>
<path d="M10 8 V252 A40 40 0 0 0 90 252 V8 Z" fill="rgba(255,248,230,.04)" stroke="rgba(255,244,220,.42)" stroke-width="1.4"/>
<g clip-path="url(#c${i})"><rect x="0" y="${top}" width="100" height="${300-top}" fill="url(#g${i})"/><rect x="0" y="${top}" width="100" height="${300-top}" fill="url(#l${i})"/><ellipse cx="50" cy="${top}" rx="40" ry="3.5" fill="${c.light}" opacity=".9"/><rect x="19" y="18" width="5" height="250" rx="2.5" fill="rgba(255,255,255,.16)"/></g>
<path d="M5 8 H95" stroke="rgba(255,244,220,.55)" stroke-width="2" stroke-linecap="round"/></svg>` }
const card = cards[new URLSearchParams(location.search).get('c') || 'home']
document.getElementById('h').textContent = card.h
document.getElementById('s').textContent = card.s
document.getElementById('p').innerHTML = card.v.map((k,i) => vessel(honeys[k], i, card.v.length > 1 ? .8 : .82)).join('')
</script></body></html>
